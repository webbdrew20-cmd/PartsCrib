<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#154d7a">
<title>Sign in — Parts Crib</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="signin">

<main class="signbox">
  <div class="signlock"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="pcw"><g transform="rotate(-42 50 50)"><rect x="41" y="24" width="18" height="56" rx="9" fill="#fff"/><circle cx="50" cy="28" r="19.5" fill="#fff"/><circle cx="50" cy="77" r="18.5" fill="#fff"/><circle cx="50" cy="28" r="9" fill="#000"/><circle cx="50" cy="77" r="8" fill="#000"/><rect x="41.5" y="-12" width="17" height="40" fill="#000"/></g></mask></defs><rect width="100" height="100" fill="currentColor" mask="url(#pcw)"/></svg><span class="wm"><b>Parts</b><i>Crib</i></span></div>
  <h1>Sign in</h1>
  <p class="lead">Look up parts, check them out and back in.</p>

  <div class="field"><label for="u">User name</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="none"
           spellcheck="false" enterkeyhint="next"></div>
  <div class="field"><label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" enterkeyhint="go"></div>

  <p class="signerr" id="err"></p>
  <button class="btn primary" id="go" style="width:100%">Sign in</button>
  <p class="lead" style="margin-top:18px">Ask the maintenance administrator for an account.</p>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
"use strict";
const err = $("err");

async function signIn(){
  const wait = loginThrottleMs();
  if(wait > 0){ show(`Too many attempts — wait ${Math.ceil(wait / 1000)}s and try again.`); return; }
  const user = $("u").value.trim(), pass = $("p").value;
  if(!user || !pass){ show("Fill in both boxes."); return; }
  $("go").disabled = true; $("go").textContent = "Checking…";
  err.textContent = "";
  try{
    const who = await api("/api/login", { user, pass });
    recordLoginSuccess();
    if(who.mustChange){ location.href = "password.html"; return; }
    const back = new URLSearchParams(location.search).get("next");
    location.href = back ? decodeURIComponent(back) : "index.html";
  }catch(e){
    recordLoginFailure();
    show(e.message);
    $("go").disabled = false; $("go").textContent = "Sign in";
    $("p").value = ""; $("p").focus();
  }
}
function show(m){ err.textContent = m; }

$("go").addEventListener("click", signIn);
for(const id of ["u","p"])
  $(id).addEventListener("keydown", e => { if(e.key === "Enter") signIn(); });

// Already signed in? Skip straight through.
(async function(){
  try{
    const me = await api("/api/me");
    location.href = me.mustChange ? "password.html" : "index.html";
  }catch(e){ $("u").focus(); }
})();
</script>
</body>
</html>
