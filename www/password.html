<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#154d7a">
<title>Set your password — Parts Crib</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="signin">

<main class="signbox">
  <div class="signlock"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="pcw"><g transform="rotate(-42 50 50)"><rect x="41" y="24" width="18" height="56" rx="9" fill="#fff"/><circle cx="50" cy="28" r="19.5" fill="#fff"/><circle cx="50" cy="77" r="18.5" fill="#fff"/><circle cx="50" cy="28" r="9" fill="#000"/><circle cx="50" cy="77" r="8" fill="#000"/><rect x="41.5" y="-12" width="17" height="40" fill="#000"/></g></mask></defs><rect width="100" height="100" fill="currentColor" mask="url(#pcw)"/></svg><span class="wm"><b>Parts</b><i>Crib</i></span></div>
  <h1>Set your own password</h1>
  <p class="lead" id="lead">The password you were given is temporary. Pick one only
    you know before you go any further.</p>

  <div class="field"><label for="old">Temporary Password</label>
    <input id="old" type="password" autocomplete="current-password" enterkeyhint="next"></div>
  <div class="field"><label for="p1">New Password </label>
    <input id="p1" type="password" autocomplete="new-password" enterkeyhint="next">
    <div class="hint">At least 10 characters. Avoid common or reused passwords.</div></div>
  <div class="field"><label for="p2">Confirm Password</label>
    <input id="p2" type="password" autocomplete="new-password" enterkeyhint="go"></div>

  <p class="signerr" id="err"></p>
  <button class="btn primary" id="go" style="width:100%">Save my password</button>
  <p class="lead" style="margin-top:18px">Contact Admin. if password is lost.</p>
  <p class="lead"><a href="#" id="out">Sign out instead</a></p>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
"use strict";
const err = $("err");
let meUser = "";
function show(m){ err.textContent = m; }

async function save(){
  const oldPass = $("old").value, a = $("p1").value, b = $("p2").value;
  if(!oldPass || !a || !b){ show("Fill in all three boxes."); return; }
  if(a !== b){ show("The two new passwords do not match."); $("p2").value=""; $("p2").focus(); return; }
  const problem = passwordProblem(a, { notEqualTo: oldPass, username: meUser });
  if(problem){ show(problem); return; }
  $("go").disabled = true; $("go").textContent = "Saving…"; show("");
  try{
    await api("/api/password", { old: oldPass, new: a });
    location.href = "index.html";
  }catch(e){
    show(e.message);
    $("go").disabled = false; $("go").textContent = "Save my password";
  }
}

$("go").addEventListener("click", save);
for(const id of ["old","p1","p2"])
  $(id).addEventListener("keydown", e => { if(e.key === "Enter") save(); });
$("out").addEventListener("click", e => { e.preventDefault(); signOut(); });

(async function(){
  let me;
  try{ me = await api("/api/me"); }
  catch(e){ location.href = "login.html"; return; }
  meUser = me.user || "";
  startIdleGuard();
  // Reached by choice rather than sent here: still allowed, just worded plainly.
  if(!me.mustChange)
    $("lead").textContent = "Change the password on your account. You will stay signed in here.";
  $("old").focus();
})();
</script>
</body>
</html>
