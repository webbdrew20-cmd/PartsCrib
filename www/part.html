<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#154d7a">
<title>Part</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <a class="icon-btn" id="back" href="index.html" aria-label="Back to the list">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="pcw"><g transform="rotate(-42 50 50)"><rect x="41" y="24" width="18" height="56" rx="9" fill="#fff"/><circle cx="50" cy="28" r="19.5" fill="#fff"/><circle cx="50" cy="77" r="18.5" fill="#fff"/><circle cx="50" cy="28" r="9" fill="#000"/><circle cx="50" cy="77" r="8" fill="#000"/><rect x="41.5" y="-12" width="17" height="40" fill="#000"/></g></mask></defs><rect width="100" height="100" fill="currentColor" mask="url(#pcw)"/></svg>
    <h1 class="brand">Part</h1>
    <a class="icon-btn" id="editLink" href="#" title="Edit this part" aria-label="Edit this part">
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg></a>
  </div>
</header>

<main class="wrap" id="main">
  <div class="hero skel">
    <div class="sk sk-title"></div>
    <div class="sk sk-tag"></div>
    <div class="sk sk-onhand"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
"use strict";
const partId = new URLSearchParams(location.search).get("id") || "";
const here   = "part.html" + location.search;
let part = null, moveQty = 1;

$("back").href = backTo();
$("editLink").href = withBack("add.html?id=" + encodeURIComponent(partId), here);

function render(){
  const p = part;
  const loc = p.label
    ? `<div class="bigtag${p.nospot ? " floor" : ""}">${esc(p.label)}</div>` : "";
  const areaName = (window.areas || {})[p.area] || p.area;
  const where = p.label
    ? `<p class="where">${esc(areaName || "No area set")}</p>`
    : `<p class="where">No location recorded yet.</p>`;

  let statText;
  if(!p.tracked)             statText = p.flagged
                                ? "More of these have been asked for."
                                : "Amount not Inventoried";
  else if(p.state === "out") statText = "None left. Order more.";
  else if(p.state === "low") statText = "Getting low. Time to order more.";
  else                       statText = "In stock.";

  const onhand = p.tracked
    ? `<div class="onhand"><b id="qty">${p.qty}</b><span>${esc(p.unit || "ea")} on hand</span></div>
       <p class="statline ${p.state}" id="stat">${esc(statText)}</p>`
    : `<div class="onhand"><b>&ndash;</b><span>not counted</span></div>
       <p class="statline off">${esc(statText)}</p>`;

  // Nothing counts these, so the only way anyone learns the bin is empty is if
  // the person standing at it says so.
  const order = !p.tracked ? `
    <div class="card">
      <h3>Ordering</h3>
      <p>${p.flagged
          ? "Already on the list. Clear it once they turn up."
          : "These are not counted, so nothing flags them for you."}</p>
      <button class="btn ${p.flagged ? "ghost" : "order"}" id="btnFlag" style="width:100%">
        ${p.flagged ? "They arrived — clear it" : "Order more"}</button>
    </div>` : "";

  const move = p.tracked ? `
    <div class="card">
      <h3>Move stock</h3>
      <div class="mover">
        <label for="mq">How many</label>
        <button id="mDown" aria-label="One fewer">&minus;</button>
        <input id="mq" type="number" inputmode="numeric" min="1" value="1">
        <button id="mUp" aria-label="One more">+</button>
      </div>
      <div class="actions" style="margin-top:0">
        <button class="btn out" id="btnOut">Check out</button>
        <button class="btn in" id="btnIn">Check in</button>
      </div>
    </div>` : "";

  const kw = (p.keywords || []).length ? `
    <div class="card"><h3>Keywords</h3>
      <div class="kwlist">${p.keywords.map(k=>`<span>${esc(k)}</span>`).join("")}</div></div>` : "";

  const note = (p.comment || "").trim() ? `
    <div class="card"><h3>Notes</h3><p class="note">${esc(p.comment)}</p></div>` : "";

  $("main").innerHTML = `
    <div class="hero ${p.state}">
      <h2>${esc(p.name)}</h2>
      ${p.pn ? `<span class="pn">${esc(p.pn)}</span>` : ""}
      ${loc}${where}${onhand}
    </div>
    ${order}${move}${kw}${note}
    <div class="actions">
      <a class="btn ghost" href="${esc(backTo())}">Back to the list</a>
      ${isAdmin() ? `<a class="btn ghost" href="${esc(withBack("add.html?id=" + encodeURIComponent(partId), here))}">Edit</a>` : ""}
    </div>`;

  if(!p.tracked){
    $("btnFlag").addEventListener("click", async () => {
      const b = $("btnFlag");
      b.disabled = true;
      try{
        part = await api("/api/part/flag", { id: partId, flag: !part.flagged });
        toast(part.flagged ? "Added to the order list" : "Cleared");
        render();
      }catch(e){ b.disabled = false; toast(e.message, true); }
    });
    return;
  }
  $("mq").value = moveQty;
  $("mDown").addEventListener("click", ()=> setMove(moveQty - 1));
  $("mUp").addEventListener("click",   ()=> setMove(moveQty + 1));
  $("mq").addEventListener("input", ()=> setMove(parseInt($("mq").value || "1", 10)));
  $("btnOut").addEventListener("click", ()=> move_(-1));
  $("btnIn").addEventListener("click",  ()=> move_(1));
  syncButtons();
}
function setMove(n){
  moveQty = Math.max(1, Math.min(9999, n || 1));
  if($("mq")) $("mq").value = moveQty;
  syncButtons();
}
function syncButtons(){
  const out = $("btnOut"), inb = $("btnIn");
  if(!out || !inb) return;
  const short = part.qty < moveQty;
  out.disabled = short;
  out.textContent = short
    ? (part.qty === 0 ? "None on hand" : `Only ${part.qty} left`)
    : "Check out";
  // Say it on the button rather than letting them tap and get told no.
  const cap  = part.stock || 0;
  const room = cap > 0 ? Math.max(0, cap - part.qty) : Infinity;
  const over = moveQty > room;
  inb.disabled = over;
  inb.textContent = over
    ? (room === 0 ? `All ${cap} are in` : `Room for ${room}`)
    : "Check in";
}

async function move_(sign){
  const delta = sign * moveQty;
  const btns = [$("btnOut"), $("btnIn")];
  btns.forEach(b => b && (b.disabled = true));
  try{
    part = await api("/api/part/adjust",
                     { id: partId, delta, action: sign < 0 ? "checkout" : "checkin" });
    toast(sign < 0
      ? `Checked out ${moveQty} · ${part.qty} left`
      : `Checked in ${moveQty} · ${part.qty} on hand`);
    moveQty = 1;
    render();
  }catch(e){
    btns.forEach(b => b && (b.disabled = false));
    toast(e.message, true);
  }
}

(async function(){
  await requireSession();
  if(!isAdmin()) $("editLink").style.display = "none";
  try{
    const cfg = await api("/api/config");
    window.areas = {};
    (cfg.areas || []).forEach(a => window.areas[a.code] = a.name);
  }catch(e){ window.areas = {}; }
  try{
    part = await api("/api/part?id=" + encodeURIComponent(partId));
    document.title = part.name || "Part";
    render();
    // Somebody else may have taken the last one while this page sat open.
    keepFresh(async () => {
      try{
        const fresh = await api("/api/part?id=" + encodeURIComponent(partId));
        if(fresh.qty !== part.qty || fresh.state !== part.state){ part = fresh; render(); }
      }catch(e){}
    }, 20);
  }catch(e){
    $("main").innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M9 12l6 6M15 12l-6 6"/></svg>
      <p><b>That part is gone</b></p>
      <p>It may have been deleted from another phone.</p></div>
      <div class="actions"><a class="btn ghost" href="${esc(backTo())}">Back to the list</a></div>`;
  }
})();
</script>
</body>
</html>
